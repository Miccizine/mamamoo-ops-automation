name: Apple Music URL Lookup

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 10AM PHT (2AM UTC)
  workflow_dispatch:      # Manual trigger for initial backfill

jobs:
  lookup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Startup jitter
        run: sleep $((RANDOM % 30))

      - name: Run Apple Music lookup
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node src/apple-music-lookup.js
