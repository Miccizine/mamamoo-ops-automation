name: YouTube Scraper

on:
  schedule:
    - cron: '0 9 * * *'    # Daily 6PM KST — comeback daily thread + 24hr post
    - cron: '0 */12 * * *' # Normal: every 12 hours
    - cron: '0 */6 * * *'  # Comeback: every 6 hours (script self-gates)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Startup jitter
        run: sleep $((RANDOM % 30))

      - name: Run YouTube scraper
        env:
          YOUTUBE_API_KEY:              ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_MILESTONE_WEBHOOK:    ${{ secrets.DISCORD_MILESTONE_WEBHOOK }}
          GOOGLE_SHEETS_ID:             ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node src/youtube.js
