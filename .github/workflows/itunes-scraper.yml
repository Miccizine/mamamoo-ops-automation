name: iTunes Scraper
on:
  schedule:
    - cron: '0 */6 * * *'    # Normal mode: every 6 hours
    - cron: '*/20 * * * *'   # Comeback mode: every 20 minutes (self-gates if OFF)
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Startup jitter
        run: sleep $((RANDOM % 30))
      - name: Run iTunes scraper
        env:
          DISCORD_MILESTONE_WEBHOOK:   ${{ secrets.DISCORD_MILESTONE_WEBHOOK }}
          GOOGLE_SHEETS_ID:            ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node src/itunes.js
